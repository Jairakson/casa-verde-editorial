# Plano gratuito de avaliação. Postgres gratuito expira em 30 dias.
projects:
  - name: casa-verde-editorial
    environments:
      - name: Production
        services:
          - type: web
            name: casa-verde-editorial
            runtime: python
            plan: free
            region: virginia
            repo: https://github.com/Jairakson/casa-verde-editorial
            branch: main
            buildCommand: pip install -r requirements.txt && python -m unittest discover -s tests -v
            startCommand: python app.py serve
            healthCheckPath: /healthz
            numInstances: 1
            envVars:
              - key: HOST
                value: 0.0.0.0
              - key: DATABASE_URL
                fromDatabase:
                  name: casa-verde-editorial-db
                  property: connectionString
              - key: COOKIE_SECURE
                value: "1"
              - key: ADMIN_EMAIL
                value: admin@casa-verde.local
              - key: ADMIN_PASSWORD
                generateValue: true
        databases:
          - name: casa-verde-editorial-db
            plan: free
            region: virginia
            databaseName: casa_verde_editorial
            user: casa_verde
            ipAllowList: []
