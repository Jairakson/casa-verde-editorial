# Plano pago necessário: SQLite usa disco persistente.
# Revise o plano no Render antes de aplicar.
projects:
  - name: casa-verde-editorial
    environments:
      - name: Production
        services:
          - type: web
            name: casa-verde-editorial
            runtime: python
            plan: 0.5c-512mb
            region: virginia
            repo: https://github.com/Jairakson/casa-verde-editorial
            branch: main
            buildCommand: python -m unittest discover -s tests -v
            startCommand: python app.py serve
            healthCheckPath: /healthz
            numInstances: 1
            disk:
              name: editorial-data
              mountPath: /var/data
              sizeGB: 1
            envVars:
              - key: HOST
                value: 0.0.0.0
              - key: DATABASE_PATH
                value: /var/data/editorial.db
              - key: COOKIE_SECURE
                value: "1"
              - key: ADMIN_EMAIL
                sync: false
              - key: ADMIN_PASSWORD
                sync: false
